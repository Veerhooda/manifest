name: Android ROM Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build EvoX Android 15
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Environment
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install git-core gnupg flex bison build-essential zip curl zlib1g-dev \
        gcc-multilib g++-multilib libc6-dev-i386 libncurses5-dev libncurses5-dev:i386 \
        x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
        fontconfig openjdk-17-jdk python3 python-is-python3 rsync bc -y

    - name: Install repo tool
      run: |
        sudo curl -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
        sudo chmod a+rx /usr/local/bin/repo

    - name: Initialize Repo
      run: |
        mkdir rom && cd rom
        repo init -u https://github.com/Veerhooda/manifest -b vic  # Replace with correct branch if needed
        repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc --all)

    - name: Clone Device Tree
      run: |
        cd rom
        git clone --depth 1 https://github.com/Veerhooda/device_oneplus_oneplus2 device/oneplus/oneplus2
        git clone --depth 1 https://github.com/Veerhooda/vendor_oneplus_oneplus2 vendor/oneplus/oneplus2
        git clone --depth 1 https://github.com/Veerhooda/kernel_oneplus_oneplus2 kernel/oneplus/oneplus2

    - name: Start Build
      run: |
        cd rom
        source build/envsetup.sh
        lunch evolution_oneplus2-userdebug
        mka bacon -j$(nproc --all)

    - name: Check ROM output
      run: |
        ls rom/out/target/product/oneplus2/ || exit 1
        ls rom/out/target/product/oneplus2/*.zip || (echo "No ROM zip found!" && exit 1)

    - name: Clean up temporary files
      run: |
        sudo rm -rf /home/runner/work/_temp/*
        sudo rm -rf /home/runner/work/manifest/manifest/rom/out/*

    - name: Upload Output
      uses: actions/upload-artifact@v4
      with:
        name: EvoX-ROM
        path: rom/out/target/product/oneplus2/*.zip

    - name: Check disk space
      run: df -h
